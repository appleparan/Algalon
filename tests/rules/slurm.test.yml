rule_files:
  - ../../monitoring/rules/slurm.yml

evaluation_interval: 30s

tests:
  # --- SlurmNodeDown ---------------------------------------------------
  # Queue exporter reports 2 nodes DOWN; must page once the 5m hold passes
  # and stay silent before it.
  - interval: 30s
    input_series:
      - series: 'slurm_node_count_per_state{state="down", instance="slurmctld.example:9092"}'
        values: '0 0 2x20'
    alert_rule_test:
      - eval_time: 7m
        groupname: slurm
        alertname: SlurmNodeDown
        exp_alerts:
          - exp_labels:
              severity: critical
              action: investigate
              state: down
              instance: slurmctld.example:9092
            exp_annotations:
              summary: '2 Slurm node(s) DOWN'
      # Only 2m above threshold at 3m -> still pending, nothing fires.
      - eval_time: 3m
        groupname: slurm
        alertname: SlurmNodeDown
        exp_alerts: []

  # Negative: a healthy cluster reports 0 DOWN nodes; the series exists but
  # never crosses the threshold.
  - interval: 30s
    input_series:
      - series: 'slurm_node_count_per_state{state="down", instance="slurmctld.example:9092"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 8m
        groupname: slurm
        alertname: SlurmNodeDown
        exp_alerts: []

  # --- SlurmNodeDrained ------------------------------------------------
  # One node left in drain long enough (10m) to look forgotten rather than
  # deliberately parked for a short maintenance window.
  - interval: 30s
    input_series:
      - series: 'slurm_node_count_per_state{state="drain", instance="slurmctld.example:9092"}'
        values: '0 1x30'
    alert_rule_test:
      - eval_time: 12m
        groupname: slurm
        alertname: SlurmNodeDrained
        exp_alerts:
          - exp_labels:
              severity: warning
              action: investigate
              state: drain
              instance: slurmctld.example:9092
            exp_annotations:
              summary: '1 Slurm node(s) DRAINED'
      # 4.5m of drain at 5m -> short maintenance, must stay quiet.
      - eval_time: 5m
        groupname: slurm
        alertname: SlurmNodeDrained
        exp_alerts: []
      # A drained node is not a down node.
      - eval_time: 12m
        groupname: slurm
        alertname: SlurmNodeDown
        exp_alerts: []

  # Negative: nothing drained.
  - interval: 30s
    input_series:
      - series: 'slurm_node_count_per_state{state="drain", instance="slurmctld.example:9092"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 12m
        groupname: slurm
        alertname: SlurmNodeDrained
        exp_alerts: []

  # --- SlurmJobFailureSpike --------------------------------------------
  # Cumulative failed-job counter jumps 2 -> 9 inside the 30m window.
  - interval: 30s
    input_series:
      - series: 'slurm_job_count_per_state{state="failed", instance="slurmctld.example:9092"}'
        values: '2x60 9x60'
    alert_rule_test:
      - eval_time: 45m
        groupname: slurm
        alertname: SlurmJobFailureSpike
        exp_alerts:
          - exp_labels:
              severity: warning
              action: investigate
              state: failed
              instance: slurmctld.example:9092
            exp_annotations:
              summary: '7 Slurm job(s) entered failed state in the last 30m'

  # Negative: 2 failures in 30m is normal attrition, below the >3 threshold.
  - interval: 30s
    input_series:
      - series: 'slurm_job_count_per_state{state="failed", instance="slurmctld.example:9092"}'
        values: '2x60 4x60'
    alert_rule_test:
      - eval_time: 45m
        groupname: slurm
        alertname: SlurmJobFailureSpike
        exp_alerts: []

  # --- SlurmQueueStalledWithIdleNodes ----------------------------------
  # 5 jobs pending for 30m while 3 nodes sit idle -> scheduler/partition
  # misconfiguration, not a capacity shortage.
  - interval: 30s
    input_series:
      - series: 'slurm_job_count_per_state{state="pending", instance="slurmctld.example:9092"}'
        values: '5x80'
      - series: 'slurm_node_count_per_state{state="idle", instance="slurmctld.example:9092"}'
        values: '3x80'
    alert_rule_test:
      - eval_time: 35m
        groupname: slurm
        alertname: SlurmQueueStalledWithIdleNodes
        exp_alerts:
          - exp_labels:
              severity: warning
              action: investigate
              state: pending
              instance: slurmctld.example:9092
            exp_annotations:
              summary: '5 Slurm job(s) pending for 30m while nodes sit idle - check partition/QOS limits'
      # Only 10m of stall -> below the 30m hold.
      - eval_time: 10m
        groupname: slurm
        alertname: SlurmQueueStalledWithIdleNodes
        exp_alerts: []

  # Negative (required by the brief): pending work exists but every node is
  # busy (idle == 0). A full cluster with a queue is healthy, not stalled.
  - interval: 30s
    input_series:
      - series: 'slurm_job_count_per_state{state="pending", instance="slurmctld.example:9092"}'
        values: '5x80'
      - series: 'slurm_node_count_per_state{state="idle", instance="slurmctld.example:9092"}'
        values: '0x80'
    alert_rule_test:
      - eval_time: 35m
        groupname: slurm
        alertname: SlurmQueueStalledWithIdleNodes
        exp_alerts: []

  # --- SlurmJobGpuIdle --------------------------------------------------
  # Two concurrent jobs from the per-node job exporter:
  #   12345 (alice, gpu01) averages 4% across its 2 GPUs   -> wasting the
  #                                                           allocation
  #   67890 (bob,   gpu02) averages exactly 10%            -> boundary case,
  #                                                           must NOT fire
  # Exactly one alert may be produced, carrying slurmjobid/user/node into
  # Slack.
  - interval: 30s
    input_series:
      - series: 'slurm_job_utilization_gpu{slurmjobid="12345", user="alice", node="gpu01", gpu="0", instance="gpu01.example:9798"}'
        values: '5x80'
      - series: 'slurm_job_utilization_gpu{slurmjobid="12345", user="alice", node="gpu01", gpu="1", instance="gpu01.example:9798"}'
        values: '3x80'
      - series: 'slurm_job_utilization_gpu{slurmjobid="67890", user="bob", node="gpu02", gpu="0", instance="gpu02.example:9798"}'
        values: '8x80'
      - series: 'slurm_job_utilization_gpu{slurmjobid="67890", user="bob", node="gpu02", gpu="1", instance="gpu02.example:9798"}'
        values: '12x80'
    alert_rule_test:
      - eval_time: 35m
        groupname: slurm
        alertname: SlurmJobGpuIdle
        exp_alerts:
          - exp_labels:
              severity: warning
              action: investigate
              slurmjobid: "12345"
              user: alice
              node: gpu01
            exp_annotations:
              summary: 'Job 12345 (user alice) is holding GPUs on gpu01 below 10% utilization for 30m'
      # Idle for only 10m -> below the 30m hold, no page yet.
      - eval_time: 10m
        groupname: slurm
        alertname: SlurmJobGpuIdle
        exp_alerts: []

  # --- SlurmNodeFailJobs ------------------------------------------------
  # Two jobs land in NODE_FAIL inside the 30m window. Slurm itself blamed
  # the node, so there is no user-error reading of this state and any
  # occurrence pages.
  - interval: 30s
    input_series:
      - series: 'slurm_jobs_completed_total{state="node_fail", partition="gpu", account="delta", instance="slurmctld.example:9100"}'
        values: '0x60 2x60'
    alert_rule_test:
      - eval_time: 60m
        groupname: slurm
        alertname: SlurmNodeFailJobs
        exp_alerts:
          - exp_labels:
              severity: warning
              action: investigate
            exp_annotations:
              summary: '2 job(s) ended NODE_FAIL in the last 30m - Slurm blamed the node, not the job'

  # Negative: the counter exists (collector installed) but has not moved
  # in the window. A cluster with an old NODE_FAIL in its history is not
  # a cluster with a NODE_FAIL now.
  - interval: 30s
    input_series:
      - series: 'slurm_jobs_completed_total{state="node_fail", partition="gpu", account="delta", instance="slurmctld.example:9100"}'
        values: '2x120'
    alert_rule_test:
      - eval_time: 60m
        groupname: slurm
        alertname: SlurmNodeFailJobs
        exp_alerts: []

  # --- SlurmNodeFailureConcentration ------------------------------------
  # Three nodes have failure history (so the degenerate-cluster guard is
  # satisfied), and every failure in the window lands on gpu01: 6 of 6.
  # Above the absolute floor of 4 and well past the 50% share.
  - interval: 30s
    input_series:
      - series: 'slurm_job_node_failures_total{node="gpu01", instance="slurmctld.example:9100"}'
        values: '0x60 6x60'
      - series: 'slurm_job_node_failures_total{node="gpu02", instance="slurmctld.example:9100"}'
        values: '1x120'
      - series: 'slurm_job_node_failures_total{node="gpu03", instance="slurmctld.example:9100"}'
        values: '1x120'
    alert_rule_test:
      - eval_time: 60m
        groupname: slurm
        alertname: SlurmNodeFailureConcentration
        exp_alerts:
          - exp_labels:
              severity: warning
              action: investigate
              node: gpu01
              instance: slurmctld.example:9100
            exp_annotations:
              summary: 'gpu01 holds 6 of the last 30m job failures - more than half the cluster total'

  # Boundary: gpu01 owns every failure in the window, but only 3 of them.
  # Below the absolute floor, so ordinary attrition that happened to land
  # on one node does not page.
  - interval: 30s
    input_series:
      - series: 'slurm_job_node_failures_total{node="gpu01", instance="slurmctld.example:9100"}'
        values: '0x60 3x60'
      - series: 'slurm_job_node_failures_total{node="gpu02", instance="slurmctld.example:9100"}'
        values: '1x120'
      - series: 'slurm_job_node_failures_total{node="gpu03", instance="slurmctld.example:9100"}'
        values: '1x120'
    alert_rule_test:
      - eval_time: 60m
        groupname: slurm
        alertname: SlurmNodeFailureConcentration
        exp_alerts: []

  # Negative: plenty of failures on gpu01 (5, over the floor) but they are
  # spread across the fleet - 5 of 12 is not a majority. Diffuse failure
  # is what user error looks like, and this rule must ignore it.
  - interval: 30s
    input_series:
      - series: 'slurm_job_node_failures_total{node="gpu01", instance="slurmctld.example:9100"}'
        values: '0x60 5x60'
      - series: 'slurm_job_node_failures_total{node="gpu02", instance="slurmctld.example:9100"}'
        values: '0x60 5x60'
      - series: 'slurm_job_node_failures_total{node="gpu03", instance="slurmctld.example:9100"}'
        values: '0x60 2x60'
    alert_rule_test:
      - eval_time: 60m
        groupname: slurm
        alertname: SlurmNodeFailureConcentration
        exp_alerts: []

  # Degenerate cluster: one node has ever failed a job, and it owns 100%
  # of a large burst. "All failures are on the only node" is arithmetic,
  # not evidence, so the count guard keeps this silent.
  - interval: 30s
    input_series:
      - series: 'slurm_job_node_failures_total{node="gpu01", instance="slurmctld.example:9100"}'
        values: '0x60 9x60'
    alert_rule_test:
      - eval_time: 60m
        groupname: slurm
        alertname: SlurmNodeFailureConcentration
        exp_alerts: []

  # --- SlurmFailureSpreadAcrossAccounts ---------------------------------
  # Three accounts failing at once, 7 jobs in total: no single user's
  # mistake can produce this shape.
  - interval: 30s
    input_series:
      - series: 'slurm_jobs_completed_total{state="failed", partition="gpu", account="alpha", instance="slurmctld.example:9100"}'
        values: '0x60 3x60'
      - series: 'slurm_jobs_completed_total{state="failed", partition="gpu", account="beta", instance="slurmctld.example:9100"}'
        values: '0x60 2x60'
      - series: 'slurm_jobs_completed_total{state="failed", partition="cpu", account="gamma", instance="slurmctld.example:9100"}'
        values: '0x60 2x60'
    alert_rule_test:
      - eval_time: 60m
        groupname: slurm
        alertname: SlurmFailureSpreadAcrossAccounts
        exp_alerts:
          - exp_labels:
              severity: warning
              action: investigate
            exp_annotations:
              summary: 'Job failures in the last 30m span 3 accounts - a cluster-side fault, not one user'

  # Boundary on breadth: only two accounts, and a big pile of failures in
  # one of them. That is exactly the one-bad-submission-script case the
  # doctrine refuses to page on.
  - interval: 30s
    input_series:
      - series: 'slurm_jobs_completed_total{state="failed", partition="gpu", account="alpha", instance="slurmctld.example:9100"}'
        values: '0x60 9x60'
      - series: 'slurm_jobs_completed_total{state="failed", partition="gpu", account="beta", instance="slurmctld.example:9100"}'
        values: '0x60 1x60'
    alert_rule_test:
      - eval_time: 60m
        groupname: slurm
        alertname: SlurmFailureSpreadAcrossAccounts
        exp_alerts: []

  # Boundary on volume: three accounts, but 5 failures in total - not
  # more than 5. A quiet afternoon in which three people each fluffed a
  # job is not an incident.
  - interval: 30s
    input_series:
      - series: 'slurm_jobs_completed_total{state="failed", partition="gpu", account="alpha", instance="slurmctld.example:9100"}'
        values: '0x60 2x60'
      - series: 'slurm_jobs_completed_total{state="failed", partition="gpu", account="beta", instance="slurmctld.example:9100"}'
        values: '0x60 2x60'
      - series: 'slurm_jobs_completed_total{state="failed", partition="cpu", account="gamma", instance="slurmctld.example:9100"}'
        values: '0x60 1x60'
    alert_rule_test:
      - eval_time: 60m
        groupname: slurm
        alertname: SlurmFailureSpreadAcrossAccounts
        exp_alerts: []
