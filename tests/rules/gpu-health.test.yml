rule_files:
  - ../../monitoring/rules/gpu-health.yml

evaluation_interval: 30s

tests:
  # 88C sustained -> warning only, not critical
  - interval: 30s
    input_series:
      - series: 'DCGM_FI_DEV_GPU_TEMP{instance="worker1:9400", gpu="0"}'
        values: '88x20'
    alert_rule_test:
      - eval_time: 6m
        groupname: gpu-health
        alertname: GpuTempHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              action: investigate
              instance: worker1:9400
              gpu: "0"
            exp_annotations:
              summary: 'GPU temperature 88C on worker1:9400 GPU 0 (>85C for 5m)'
      - eval_time: 6m
        groupname: gpu-health
        alertname: GpuTempCritical
        exp_alerts: []

  # 95C sustained -> critical fires (warning also fires; assert both)
  - interval: 30s
    input_series:
      - series: 'DCGM_FI_DEV_GPU_TEMP{instance="worker2:9400", gpu="1"}'
        values: '95x20'
    alert_rule_test:
      - eval_time: 6m
        groupname: gpu-health
        alertname: GpuTempCritical
        exp_alerts:
          - exp_labels:
              severity: critical
              action: investigate
              instance: worker2:9400
              gpu: "1"
            exp_annotations:
              summary: 'GPU temperature 95C on worker2:9400 GPU 1 (>92C for 2m)'

  # HBM temperature high -> warning
  - interval: 30s
    input_series:
      - series: 'DCGM_FI_DEV_MEMORY_TEMP{instance="worker3:9400", gpu="2"}'
        values: '97x20'
    alert_rule_test:
      - eval_time: 6m
        groupname: gpu-health
        alertname: GpuMemoryTempHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              action: investigate
              instance: worker3:9400
              gpu: "2"
            exp_annotations:
              summary: 'HBM temperature 97C on worker3:9400 GPU 2 (>95C for 5m)'

  # Throttle bitmask 8 (HW slowdown) sustained 10m -> warning
  - interval: 30s
    input_series:
      - series: 'DCGM_FI_DEV_CLOCKS_EVENT_REASONS{instance="worker4:9400", gpu="3"}'
        values: '8x30'
    alert_rule_test:
      - eval_time: 11m
        groupname: gpu-health
        alertname: GpuClocksThrottled
        exp_alerts:
          - exp_labels:
              severity: warning
              action: investigate
              instance: worker4:9400
              gpu: "3"
            exp_annotations:
              summary: 'GPU clocks throttled (reason bitmask 8) on worker4:9400 GPU 3 for 10m'

  # Benign reasons (idle 0x1, app clocks 0x2, SW power cap 0x4) never fire
  - interval: 30s
    input_series:
      - series: 'DCGM_FI_DEV_CLOCKS_EVENT_REASONS{instance="worker5:9400", gpu="0"}'
        values: '4x30'
    alert_rule_test:
      - eval_time: 11m
        groupname: gpu-health
        alertname: GpuClocksThrottled
        exp_alerts: []

  # --- GpuBusyButHollow -------------------------------------------------
  # gpu01: both GPUs report ~95% utilization while SM_ACTIVE sits at 0.05 -
  # kernels are resident but nothing is executing. The classic starved
  # dataloader. gpu02 is the control: same high utilization, but the warps
  # are genuinely running (SM_ACTIVE 0.85), so it must stay silent.
  - interval: 30s
    input_series:
      - series: 'DCGM_FI_DEV_GPU_UTIL{node="gpu01", instance="gpu01:9400", gpu="0"}'
        values: '95x80'
      - series: 'DCGM_FI_DEV_GPU_UTIL{node="gpu01", instance="gpu01:9400", gpu="1"}'
        values: '95x80'
      - series: 'DCGM_FI_PROF_SM_ACTIVE{node="gpu01", instance="gpu01:9400", gpu="0"}'
        values: '0.05x80'
      - series: 'DCGM_FI_PROF_SM_ACTIVE{node="gpu01", instance="gpu01:9400", gpu="1"}'
        values: '0.05x80'
      - series: 'DCGM_FI_DEV_GPU_UTIL{node="gpu02", instance="gpu02:9400", gpu="0"}'
        values: '95x80'
      - series: 'DCGM_FI_PROF_SM_ACTIVE{node="gpu02", instance="gpu02:9400", gpu="0"}'
        values: '0.85x80'
    alert_rule_test:
      - eval_time: 35m
        groupname: gpu-health
        alertname: GpuBusyButHollow
        exp_alerts:
          - exp_labels:
              severity: warning
              action: investigate
              node: gpu01
            exp_annotations:
              summary: 'GPUs on gpu01 report 95% utilization but almost no warps are executing (SM active <20% for 30m) - input pipeline, CPU or collective wait, not the GPU'
      # 10m of hollow running is a checkpoint restore or a data staging
      # phase, not a broken input pipeline. Below the 30m hold.
      - eval_time: 10m
        groupname: gpu-health
        alertname: GpuBusyButHollow
        exp_alerts: []

  # Boundary: SM_ACTIVE sits exactly at 0.2. The rule asks for < 0.2, so
  # the boundary itself is "working", not hollow.
  - interval: 30s
    input_series:
      - series: 'DCGM_FI_DEV_GPU_UTIL{node="gpu01", instance="gpu01:9400", gpu="0"}'
        values: '95x80'
      - series: 'DCGM_FI_PROF_SM_ACTIVE{node="gpu01", instance="gpu01:9400", gpu="0"}'
        values: '0.2x80'
    alert_rule_test:
      - eval_time: 35m
        groupname: gpu-health
        alertname: GpuBusyButHollow
        exp_alerts: []

  # Negative: an idle node. Low SM activity with low utilization is a GPU
  # nobody is using - that is SlurmJobGpuIdle's territory (or nobody's),
  # not a hollow-running job.
  - interval: 30s
    input_series:
      - series: 'DCGM_FI_DEV_GPU_UTIL{node="gpu03", instance="gpu03:9400", gpu="0"}'
        values: '2x80'
      - series: 'DCGM_FI_PROF_SM_ACTIVE{node="gpu03", instance="gpu03:9400", gpu="0"}'
        values: '0.01x80'
    alert_rule_test:
      - eval_time: 35m
        groupname: gpu-health
        alertname: GpuBusyButHollow
        exp_alerts: []
