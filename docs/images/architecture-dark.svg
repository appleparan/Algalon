  <text x="522" y="197" font-size="12" fill="#94a3b8">scrape · every 30s</text>

  <!-- vmagent -->
  <rect x="435" y="220" width="150" height="44" rx="7" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
  <text x="510" y="246" text-anchor="middle" font-size="13.5" font-weight="600" fill="#e2e8f0">vmagent</text>

  <!-- remote write arrow -->
  <line x1="510" y1="264" x2="510" y2="306" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
