<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 870 600" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Epilog log push: slurmctld -> VictoriaLogs, routed over the top -->
  <polyline points="110,48 110,26 820,26 820,206" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="465" y="20" text-anchor="middle" font-size="12" fill="#94a3b8">epilog · push job stdout at job end</text>

  <!-- Slurm controller group (optional) -->
  <rect x="20" y="48" width="180" height="122" rx="10" fill="#161e2e" stroke="#475569" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="110" y="74" text-anchor="middle" font-size="14" font-weight="600" fill="#e2e8f0">Slurm controller</text>
  <text x="110" y="92" text-anchor="middle" font-size="12" fill="#94a3b8">optional · slurmctld</text>

  <rect x="32" y="106" width="156" height="46" rx="7" fill="#0f172a" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="110" y="126" text-anchor="middle" font-size="13" font-weight="600" fill="#e2e8f0">slurm-exporter</text>
  <text x="110" y="142" text-anchor="middle" font-size="11.5" fill="#94a3b8">queue state&#160;&#160;:9092</text>

  <!-- slurmctld scrape arrow -->
  <line x1="110" y1="170" x2="431" y2="240" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="225" y="188" font-size="12" fill="#94a3b8">scrape</text>

  <!-- Worker group -->
  <rect x="210" y="48" width="600" height="122" rx="10" fill="#161e2e" stroke="#475569" stroke-width="1.5"/>
  <text x="510" y="74" text-anchor="middle" font-size="14" font-weight="600" fill="#e2e8f0">GPU worker nodes ×N</text>
  <text x="510" y="92" text-anchor="middle" font-size="12" fill="#94a3b8">Compose stack or k3s DaemonSets</text>

  <rect x="222" y="106" width="138" height="46" rx="7" fill="#0f172a" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="291" y="126" text-anchor="middle" font-size="13" font-weight="600" fill="#e2e8f0">dcgm-exporter</text>
  <text x="291" y="142" text-anchor="middle" font-size="11.5" fill="#94a3b8">GPU · XID · ECC&#160;&#160;:9400</text>

  <rect x="368" y="106" width="138" height="46" rx="7" fill="#0f172a" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="437" y="126" text-anchor="middle" font-size="13" font-weight="600" fill="#e2e8f0">node-exporter</text>
  <text x="437" y="142" text-anchor="middle" font-size="11.5" fill="#94a3b8">OS · NFS · IRQ&#160;&#160;:9100</text>

  <rect x="514" y="106" width="138" height="46" rx="7" fill="#0f172a" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="583" y="126" text-anchor="middle" font-size="12" font-weight="600" fill="#e2e8f0">slurm-job-exporter</text>
  <text x="583" y="142" text-anchor="middle" font-size="11.5" fill="#94a3b8">per-job GPU&#160;&#160;:9798</text>

  <rect x="660" y="106" width="138" height="46" rx="7" fill="#0f172a" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="729" y="126" text-anchor="middle" font-size="13" font-weight="600" fill="#e2e8f0">all-smi</text>
  <text x="729" y="142" text-anchor="middle" font-size="11.5" fill="#94a3b8">optional&#160;&#160;:9090</text>

  <!-- scrape arrow -->
