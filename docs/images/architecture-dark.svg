  <text x="510" y="347" text-anchor="middle" font-size="11.5" fill="#a5b4fc">time series storage&#160;&#160;:8428</text>

  <!-- VictoriaLogs (optional) -->
  <rect x="685" y="210" width="150" height="48" rx="7" fill="#312e81" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="760" y="230" text-anchor="middle" font-size="13.5" font-weight="600" fill="#e0e7ff">VictoriaLogs</text>
  <text x="760" y="247" text-anchor="middle" font-size="11.5" fill="#a5b4fc">job logs&#160;&#160;:9428</text>

  <!-- Grafana -->
  <rect x="685" y="310" width="150" height="48" rx="7" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
  <text x="760" y="330" text-anchor="middle" font-size="13.5" font-weight="600" fill="#e2e8f0">Grafana</text>
  <text x="760" y="347" text-anchor="middle" font-size="11.5" fill="#94a3b8">9 dashboards&#160;&#160;:3000</text>
  <line x1="681" y1="334" x2="619" y2="334" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="760" y1="306" x2="760" y2="262" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="772" y="288" font-size="12" fill="#94a3b8">query logs</text>

  <!-- query arrow -->
  <line x1="510" y1="358" x2="510" y2="401" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
