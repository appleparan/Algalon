  <!-- vmalert -->
  <rect x="420" y="405" width="180" height="48" rx="7" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
  <text x="510" y="425" text-anchor="middle" font-size="13.5" font-weight="600" fill="#e2e8f0">vmalert</text>
  <text x="510" y="442" text-anchor="middle" font-size="11.5" fill="#94a3b8">8 rule groups&#160;&#160;:8880</text>

  <!-- fired alerts arrow -->
  <line x1="510" y1="453" x2="510" y2="496" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="522" y="478" font-size="12" fill="#94a3b8">fired alerts</text>

  <!-- Alertmanager -->
  <rect x="400" y="500" width="220" height="48" rx="7" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
  <text x="510" y="520" text-anchor="middle" font-size="13.5" font-weight="600" fill="#e2e8f0">Alertmanager</text>
  <text x="510" y="537" text-anchor="middle" font-size="11.5" fill="#94a3b8">route · group · inhibit&#160;&#160;:9093</text>

  <!-- Slack routes -->
  <line x1="620" y1="516" x2="681" y2="500" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="620" y1="532" x2="681" y2="548" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="685" y="476" width="150" height="36" rx="7" fill="#3f1d1d" stroke="#f87171" stroke-width="1.5"/>
  <text x="760" y="499" text-anchor="middle" font-size="12.5" font-weight="600" fill="#fecaca">Slack · critical</text>

  <rect x="685" y="538" width="150" height="36" rx="7" fill="#3d2410" stroke="#fb923c" stroke-width="1.5"/>
  <text x="760" y="561" text-anchor="middle" font-size="12.5" font-weight="600" fill="#fed7aa">Slack · warning</text>

  <!-- single source note -->
  <rect x="14" y="310" width="196" height="96" rx="7" fill="#131a26" stroke="#475569" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="112" y="332" text-anchor="middle" font-size="12" font-weight="600" fill="#cbd5e1">monitoring/ — single source</text>
  <text x="112" y="350" text-anchor="middle" font-size="11.5" fill="#94a3b8">rules · dashboards · scrape</text>
  <text x="112" y="366" text-anchor="middle" font-size="11.5" fill="#94a3b8">alerting · exporters · slurm</text>
  <text x="112" y="386" text-anchor="middle" font-size="10" fill="#7d8a9c">mounted by Compose · packed by Helm</text>
</svg>
