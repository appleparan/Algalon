# Slurm queue and per-job accounting alerts (Phase 6).
#
# Two external exporters feed this group — neither runs inside Algalon:
#   * prometheus-slurm-exporter (rivosinc) on the slurmctld/login node,
#     scrape job `slurm`, port 9092 — cluster-wide queue and node state:
#     slurm_node_count_per_state{state="alloc|idle|drain|down"},
#     slurm_job_count_per_state{state="pending|running|failed|..."}.
#   * slurm-job-exporter (guilbaults) on every compute node, scrape job
#     `slurm-job`, port 9798 — cgroup/NVML per-job accounting labelled with
#     `user`, `account` and `slurmjobid`; its targets carry Algalon's `node`
#     label, which is what lets job series join DCGM/node-exporter series
#     `on(node)`.
#
# Design intent: the queue exporter answers "is the scheduler healthy?"
# (rules 1-4), the job exporter answers "is the allocated hardware actually
# being used?" (rule 5). Slurm integration is opt-in, so an absent exporter
# simply produces no series and no alerts.
#
# Severities follow the repo contract: only a scheduler-visible node loss
# pages as critical; everything else is a warning with action `investigate`,
# because the remedy is always human triage (drain reason, partition/QOS
# limits, job owner) rather than an automated restart or reset.
groups:
  - name: slurm
    interval: 30s
    rules:
      # Nodes in DOWN state are unusable capacity and usually mean the
      # slurmd/host died rather than an operator action. 5m of hold filters
      # the brief DOWN blips seen while a node reboots into the scheduler.
      # Critical: unlike drain, nothing about this is intentional.
      - alert: SlurmNodeDown
        expr: slurm_node_count_per_state{state="down"} > 0
        for: 5m
        labels:
          severity: critical
          action: investigate
        annotations:
          summary: '{{ $value }} Slurm node(s) DOWN'

      # DRAIN is an operator/health-check action, so it is expected to occur
      # — what is not expected is for it to persist. 10m (double the DOWN
      # hold) lets a short maintenance drain pass silently while catching
      # nodes that were drained by a health check and then forgotten,
      # quietly shrinking the cluster.
      - alert: SlurmNodeDrained
        expr: slurm_node_count_per_state{state="drain"} > 0
        for: 10m
        labels:
          severity: warning
          action: investigate
        annotations:
          summary: '{{ $value }} Slurm node(s) DRAINED'

      # A burst of failed jobs is the scheduler-side echo of a cluster-side
      # fault (bad node, broken shared filesystem, exhausted quota). The 30m
      # window with a >3 threshold ignores ordinary per-user attrition and
      # only reacts to a cluster-wide pattern. No `for:` — the window itself
      # already provides the smoothing.
      - alert: SlurmJobFailureSpike
        expr: delta(slurm_job_count_per_state{state="failed"}[30m]) > 3
        labels:
          severity: warning
          action: investigate
        annotations:
          summary: '{{ $value }} Slurm job(s) entered failed state in the last 30m'

      # Pending work while nodes sit idle is the signature of a
      # scheduler/partition misconfiguration (wrong partition, QOS or
      # association limit, unsatisfiable node feature/GRES request) rather
      # than a capacity shortage — capacity shortage shows pending jobs with
      # zero idle nodes, which this rule deliberately ignores. `and on()`
      # correlates the two cluster-wide scalars without any shared labels;
      # the resulting alert keeps the pending-job series' labels. 30m of
      # hold keeps normal backfill/scheduling latency out of Slack.
      - alert: SlurmQueueStalledWithIdleNodes
        expr: >-
          (slurm_job_count_per_state{state="pending"} > 0)
          and on() (slurm_node_count_per_state{state="idle"} > 0)
        for: 30m
        labels:
          severity: warning
          action: investigate
        annotations:
          summary: '{{ $value }} Slurm job(s) pending for 30m while nodes sit idle - check partition/QOS limits'

      # Allocation-waste alert, and the reason the per-node job exporter is
      # part of Phase 6 at all. The Lablup report's introduction cites
      # Microsoft's finding of a median GPU utilization around 52% in
      # production training clusters: the dominant failure mode of a GPU
      # cluster is not a broken GPU but a healthy GPU held idle by a job.
      # DCGM alone cannot report this — it has no idea which job owns the
      # device — so the attribution comes from the job exporter's cgroup
      # labels. `avg by (node, user, slurmjobid)` collapses the per-GPU
      # series into one alert per job-on-node, and those three labels ride
      # into the Slack notification, so the operator gets the owner and the
      # job id without opening a dashboard. 30m of hold skips data staging,
      # checkpoint restore and other legitimately GPU-quiet phases.
      - alert: SlurmJobGpuIdle
        expr: avg by (node, user, slurmjobid) (slurm_job_utilization_gpu) < 10
        for: 30m
        labels:
          severity: warning
          action: investigate
        annotations:
          summary: 'Job {{ $labels.slurmjobid }} (user {{ $labels.user }}) is holding GPUs on {{ $labels.node }} below 10% utilization for 30m'

      # --- Failure distribution (needs the optional sacct collector) -----
      #
      # The three rules below read `monitoring/slurm/sacct-textfile.sh`.
      # Without it the series are absent and nothing here can fire, which
      # is the same opt-in contract the rest of this file follows.
      #
      # They exist because of a distinction the SLO layer makes
      # explicitly (see the header of slo.yml): the *total* number of
      # failed jobs is not pageable, because on a shared research cluster
      # most FAILED jobs are user error and an operator cannot fix a typo
      # in somebody's batch script. But user error has a shape — it is
      # diffuse. It lands on whichever node the scheduler picked, and it
      # belongs to one account at a time. Failures piling onto a single
      # node, or spreading across many accounts at once, are shapes user
      # error cannot produce. So Algalon pages on the shape and stays
      # quiet about the total.

      # Slurm's own verdict, and the least ambiguous signal in this file:
      # NODE_FAIL means slurmctld decided the *node* killed the job. No
      # user can cause that state, so there is no user-error explanation
      # to weigh — any occurrence is worth a look. No `for:` hold; the
      # 30m window is the smoothing, exactly like SlurmJobFailureSpike.
      - alert: SlurmNodeFailJobs
        expr: sum(increase(slurm_jobs_completed_total{state="node_fail"}[30m])) > 0
        labels:
          severity: warning
          action: investigate
        annotations:
          summary: '{{ $value | printf "%.0f" }} job(s) ended NODE_FAIL in the last 30m - Slurm blamed the node, not the job'

      # Concentration: one node holding the majority of recent job
      # failures. Peer-relative in the same style as node-precursor.yml —
      # the absolute count is meaningless without knowing what the rest
      # of the fleet is doing, so the rule asks for both an absolute floor
      # (>= 4 failures, above ordinary attrition) and a relative share
      # (> half of every failure in the window).
      #
      # `and on() (count(...) >= 3)` is the degenerate-cluster guard,
      # mirroring node-precursor's `count(up{job="node"} == 1) >= 3`:
      # where only one or two nodes have ever failed a job, "most
      # failures are on one node" is arithmetic, not evidence. It also
      # means a genuinely tiny cluster never pages on this rule, which is
      # the right answer — an operator there already knows which node it
      # is.
      #
      # The alert carries `node`, so the Alertmanager inhibit rule
      # (node-scoped critical suppresses same-node warnings) silences it
      # automatically when a critical already names the cause on that
      # node — a GpuXidFellOffBus is the explanation for the failures,
      # not a second incident.
      - alert: SlurmNodeFailureConcentration
        expr: >-
          (increase(slurm_job_node_failures_total[30m]) >= 4)
          and
          (
            increase(slurm_job_node_failures_total[30m])
              / scalar(sum(increase(slurm_job_node_failures_total[30m]))) > 0.5
          )
          and on() (count(slurm_job_node_failures_total) >= 3)
        labels:
          severity: warning
          action: investigate
        annotations:
          summary: '{{ $labels.node }} holds {{ $value | printf "%.0f" }} of the last 30m job failures - more than half the cluster total'

      # Breadth: failures hitting several accounts at once. One user's
      # typo can never satisfy this condition — it is confined to that
      # user's account by construction. A shared filesystem that went
      # away, a sick slurmctld, an expired credential or a bad module
      # update must. Both halves are required: three accounts failing one
      # job each is a quiet afternoon, and six failures inside a single
      # account is one bad submission script.
      - alert: SlurmFailureSpreadAcrossAccounts
        expr: >-
          count(sum by (account) (increase(slurm_jobs_completed_total{state="failed"}[30m])) > 0) >= 3
          and on()
          sum(increase(slurm_jobs_completed_total{state="failed"}[30m])) > 5
        labels:
          severity: warning
          action: investigate
        annotations:
          summary: 'Job failures in the last 30m span {{ $value | printf "%.0f" }} accounts - a cluster-side fault, not one user'
