# Thermal / throttle health (spec §5.3, Lablup report Table 8).
# Thresholds are conservative defaults for datacenter NVIDIA parts; tune per
# fleet if your hardware documents different limits.
groups:
  - name: gpu-health
    interval: 30s
    rules:
      - alert: GpuTempHigh
        expr: DCGM_FI_DEV_GPU_TEMP > 85
        for: 5m
        labels:
          severity: warning
          action: investigate
        annotations:
          summary: 'GPU temperature {{ $value }}C on {{ $labels.instance }} GPU {{ $labels.gpu }} (>85C for 5m)'

      - alert: GpuTempCritical
        expr: DCGM_FI_DEV_GPU_TEMP > 92
        for: 2m
        labels:
          severity: critical
          action: investigate
        annotations:
          summary: 'GPU temperature {{ $value }}C on {{ $labels.instance }} GPU {{ $labels.gpu }} (>92C for 2m)'

      # HBM runs hotter than the die; sustained >95C accelerates memory wear
      # (and ECC/remap degradation tracked in gpu-ecc.yml).
      - alert: GpuMemoryTempHigh
        expr: DCGM_FI_DEV_MEMORY_TEMP > 95
        for: 5m
        labels:
          severity: warning
          action: investigate
        annotations:
          summary: 'HBM temperature {{ $value }}C on {{ $labels.instance }} GPU {{ $labels.gpu }} (>95C for 5m)'

      # CLOCKS_EVENT_REASONS is a bitmask. Bits <0x8 are benign (0x1 GPU
      # idle, 0x2 application clocks setting, 0x4 SW power cap — normal
      # during training). Bits >=0x8 (HW slowdown / thermal / power brake /
      # sync boost) indicate real performance loss: a fail-slow signal, the
      # straggler class the report says is harder to catch than fail-stop.
      - alert: GpuClocksThrottled
        expr: DCGM_FI_DEV_CLOCKS_EVENT_REASONS >= 8
        for: 10m
        labels:
          severity: warning
          action: investigate
        annotations:
          summary: 'GPU clocks throttled (reason bitmask {{ $value }}) on {{ $labels.instance }} GPU {{ $labels.gpu }} for 10m'

      # Busy-but-hollow: the GPU reports itself busy while almost no warps
      # execute. DCGM_FI_DEV_GPU_UTIL only means "a kernel was resident on
      # the device during the sample" — a job whose dataloader cannot feed
      # it, or that is blocked in an NCCL all-reduce, keeps a kernel
      # resident and reads near 100% while doing nothing. SM_ACTIVE is the
      # next layer down: the fraction of time at least one warp was
      # actually running. High util with low SM activity is the signature
      # of an input-pipeline, CPU-bound or collective-wait stall.
      #
      # Node-level attribution only. Both averages collapse to `node`, so
      # on a shared node this mixes tenants — the Phase 6 note applies
      # unchanged: node-level signals read as job signal only where the
      # job owns the whole node. The Job Explorer's per-job panels are
      # where an individual job gets diagnosed.
      #
      # 30m of hold skips checkpoint restore, data staging and other
      # legitimately compute-quiet phases. Absent-safe: DCGM_FI_PROF_* are
      # DCP fields, so a fleet that has not added them to
      # monitoring/exporters/dcgm-counters.csv produces no series and this
      # never fires.
      - alert: GpuBusyButHollow
        expr: >-
          avg by (node) (DCGM_FI_DEV_GPU_UTIL) > 80
          and avg by (node) (DCGM_FI_PROF_SM_ACTIVE) < 0.2
        for: 30m
        labels:
          severity: warning
          action: investigate
        annotations:
          summary: 'GPUs on {{ $labels.node }} report {{ $value | printf "%.0f" }}% utilization but almost no warps are executing (SM active <20% for 30m) - input pipeline, CPU or collective wait, not the GPU'
