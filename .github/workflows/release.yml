name: Release

on:
  push:
    tags: ["v*"]
  # Retro-publish an existing tag's chart (e.g. the tag predates this
  # workflow, or a publish attempt failed after the release was created).
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)publish the chart for (e.g. v0.5.0)"
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Create GitHub release
    # Tag pushes only — a workflow_dispatch targets a tag whose release
    # already exists.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; skipping."
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          fi

  publish-chart:
    name: Publish Helm chart (OCI + release asset)
    # Runs for both triggers; on dispatch it must not race a missing release,
    # so it waits on the release job only when that job actually ran.
    needs: [release]
    if: always() && (needs.release.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Set up Helm
        uses: azure/setup-helm@v4

      # files/ is generated content (gitignored) — the chart is incomplete
      # without it. Same step the local quality gates run.
      - name: Sync chart files
        run: make helm-sync

      - name: Verify chart version matches tag
        run: |
          chart_version="$(awk '/^version:/{print $2}' deploy/helm/algalon/Chart.yaml)"
          [ "v${chart_version}" = "${TAG}" ] || {
            echo "Chart.yaml version (${chart_version}) does not match tag (${TAG})" >&2
            exit 1
          }

      - name: Package chart
        run: helm package deploy/helm/algalon --destination dist/

      - name: Push chart to GHCR (OCI)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | helm registry login ghcr.io \
            --username "$GITHUB_ACTOR" --password-stdin
          helm push dist/algalon-*.tgz "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER}/charts"

      - name: Attach chart to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" dist/algalon-*.tgz --clobber
