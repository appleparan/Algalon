name: Monitoring Tests

on:
  push:
    branches: [main]
    paths:
      - 'monitoring/**'
      - 'deploy/compose/**'
      - 'tests/rules/**'
      - 'Makefile'
      - '.github/workflows/monitoring-test.yml'
  pull_request:
    paths:
      - 'monitoring/**'
      - 'deploy/compose/**'
      - 'tests/rules/**'
      - 'Makefile'
      - '.github/workflows/monitoring-test.yml'

jobs:
  monitoring:
    name: Validate rules and scrape config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate vmalert rules
        run: make rules-validate

      - name: Run rule unit tests
        run: make rules-test

      - name: Validate vmagent scrape config
        run: make scrape-validate

      - name: Validate Alertmanager config
        run: make alertmanager-validate

      - name: Validate compose stacks
        run: make compose-validate

      - name: Validate dashboards
        run: make dashboards-validate
