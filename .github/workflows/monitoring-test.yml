name: Monitoring Tests

on:
  push:
    branches: [main]
    paths:
      - 'monitoring/**'
      - 'deploy/compose/**'
      - 'deploy/helm/**'
      - 'deploy/k3s/**'
      - 'tests/rules/**'
      - 'tests/e2e/**'
      - 'Makefile'
      - '.github/workflows/monitoring-test.yml'
  pull_request:
    paths:
      - 'monitoring/**'
      - 'deploy/compose/**'
      - 'deploy/helm/**'
      - 'deploy/k3s/**'
      - 'tests/rules/**'
      - 'tests/e2e/**'
      - 'Makefile'
      - '.github/workflows/monitoring-test.yml'

jobs:
  monitoring:
    name: Validate rules and scrape config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate vmalert rules
        run: make rules-validate

      - name: Run rule unit tests
        run: make rules-test

      - name: Validate vmagent scrape config
        run: make scrape-validate

      - name: Validate Alertmanager config
        run: make alertmanager-validate

      - name: Validate compose stacks
        run: make compose-validate

      - name: Validate dashboards
        run: make dashboards-validate

      - name: Validate helm chart
        run: make helm-validate

  e2e:
    name: k3d end-to-end smoke test
    # Static validation is cheap and catches most breakage; only spin up a
    # cluster once the manifests are known to be well-formed.
    needs: monitoring
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # docker, helm and kubectl are preinstalled on ubuntu-latest.
      - name: Install k3d
        run: curl -fsSL https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash

      - name: Run k3d smoke test
        run: make e2e-k3d
