name: image-slurm-job-exporter

on:
  push:
    branches: [main]
    paths: ["docker/slurm-job-exporter/**"]
  pull_request:
    paths: ["docker/slurm-job-exporter/**"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: docker/slurm-job-exporter
          # PR = build-only gate; push to main (or manual run) publishes.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/appleparan/slurm-job-exporter:0.4.12
