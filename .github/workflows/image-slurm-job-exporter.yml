name: image-slurm-job-exporter

on:
  push:
    branches: [main]
    paths:
      - "docker/slurm-job-exporter/**"
      - ".github/workflows/image-slurm-job-exporter.yml"
  pull_request:
    paths:
      - "docker/slurm-job-exporter/**"
      - ".github/workflows/image-slurm-job-exporter.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Single source of truth for the version: the upstream release tag is
# v${SJE_VERSION} (passed through as the SJE_VERSION build-arg) and the
# published image tag is ${SJE_VERSION} — bump this one line only.
env:
  SJE_VERSION: 0.4.12
  IMAGE: ghcr.io/appleparan/slurm-job-exporter

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Build into the local daemon first so the smoke test exercises the
      # exact image that gets pushed; the push step re-uses this layer cache.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: docker/slurm-job-exporter
          load: true
          build-args: |
            SJE_VERSION=v${{ env.SJE_VERSION }}
          tags: ${{ env.IMAGE }}:${{ env.SJE_VERSION }}
      # A broken entrypoint or a missing get_gpus.sh stays invisible until a
      # cluster rolls the DaemonSet, so prove both before publishing.
      - name: Smoke test
        run: |
          docker run --rm ${{ env.IMAGE }}:${{ env.SJE_VERSION }} --help
          docker run --rm --entrypoint ls ${{ env.IMAGE }}:${{ env.SJE_VERSION }} \
            -l /usr/local/bin/get_gpus.sh
      # PR = build-only gate; push to main (or manual run) publishes.
      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: docker/slurm-job-exporter
          push: true
          build-args: |
            SJE_VERSION=v${{ env.SJE_VERSION }}
          # The bare version is a moving tag (rebuilt whenever the base image
          # or this workflow changes); the sha-suffixed one is immutable, for
          # pinning values.yaml and for rolling back to a known-good build.
          tags: |
            ${{ env.IMAGE }}:${{ env.SJE_VERSION }}
            ${{ env.IMAGE }}:${{ env.SJE_VERSION }}-${{ github.sha }}
