# -- Worker exporters (DaemonSets) --
dcgmExporter:
  enabled: true
  image: nvcr.io/nvidia/k8s/dcgm-exporter:4.6.0-4.8.3-ubi9
  port: 9400
  # gpu-operator labels GPU nodes with nvidia.com/gpu.present
  nodeSelector:
    nvidia.com/gpu.present: "true"
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
  runtimeClassName: ""
  resources:
    requests: {cpu: 100m, memory: 256Mi}

nodeExporter:
  enabled: true
  image: prom/node-exporter:v1.12.1
  port: 9100
  tolerations:
    - operator: Exists
  resources:
    requests: {cpu: 50m, memory: 64Mi}

allSmi:
  enabled: false
  image: ghcr.io/inureyes/all-smi:v0.25.0
  port: 9090
  interval: 5
  nodeSelector:
    nvidia.com/gpu.present: "true"
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
  resources:
    requests: {cpu: 100m, memory: 128Mi}

# -- Slurm integration (optional) --
# Both exporters run OUTSIDE the cluster on Slurm hosts; list them here.
slurm:
  enabled: false
  # prometheus-slurm-exporter on the slurmctld/login node (queue/partition state)
  queueTargets: []        # e.g. ["slurmctld.example.internal:9092"]
  # slurm-job-exporter on every compute node (per-job cgroup/GPU accounting)
  jobTargets: []          # e.g. [{address: "gpu01.example.internal:9798", node: "gpu01"}]

# -- Host stack --
host:
  enabled: true

victoriametrics:
  image: victoriametrics/victoria-metrics:v1.149.0
  retentionMonths: 3
  storage:
    size: 50Gi
    storageClassName: ""
  resources:
    requests: {cpu: 500m, memory: 1Gi}

vmagent:
  image: victoriametrics/vmagent:v1.149.0
  scrapeInterval: 30s
  resources:
    requests: {cpu: 200m, memory: 256Mi}

vmalert:
  image: victoriametrics/vmalert:v1.149.0
  evaluationInterval: 30s
  resources:
    requests: {cpu: 100m, memory: 128Mi}

alertmanager:
  image: prom/alertmanager:v0.33.1
  resources:
    requests: {cpu: 50m, memory: 64Mi}
  slack:
    # Either reference an existing Secret with keys
    # slack_webhook_critical / slack_webhook_warning...
    existingSecret: ""
    # ...or set URLs here and the chart creates the Secret (not recommended
    # for GitOps — values files end up in git).
    criticalUrl: ""
    warningUrl: ""

grafana:
  image: grafana/grafana:13.1.3
  adminUser: admin
  adminPassword: admin
  resources:
    requests: {cpu: 100m, memory: 256Mi}
