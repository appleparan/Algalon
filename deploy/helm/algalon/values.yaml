# -- Worker exporters (DaemonSets) --
dcgmExporter:
  enabled: true
  image: nvcr.io/nvidia/k8s/dcgm-exporter:4.6.0-4.8.3-ubi9
  port: 9400
  # gpu-operator labels GPU nodes with nvidia.com/gpu.present
  nodeSelector:
    nvidia.com/gpu.present: "true"
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
  runtimeClassName: ""
  # Extra CLI args appended to the container command. Main use: connect to
  # a host-side nv-hostengine instead of embedding one, e.g.
  # ["-r", "localhost:5555"] together with hostNetwork: true — required
  # when another DCGM client (e.g. slurm-job-exporter) shares the node,
  # because two engines cannot both watch DCGM_FI_PROF_* fields.
  extraArgs: []
  # Share the host network namespace so extraArgs can reach a host-side
  # nv-hostengine at localhost. Off by default (embedded engine).
  hostNetwork: false
  # Out-of-cluster dcgm-exporters scraped in addition to the DaemonSet pods —
  # bare-metal GPU nodes that are not cluster members. Every entry carries the
  # node label by hand (there is no kubernetes_sd to derive it from); it must
  # match the node label of the same machine's node/slurm-job entries — that
  # string is the join key across all per-node series.
  staticTargets: []   # e.g. [{address: "gpu01.example.internal:9400", node: "gpu01"}]
  resources:
    requests: {cpu: 100m, memory: 256Mi}

nodeExporter:
  enabled: true
  image: prom/node-exporter:v1.12.1
  port: 9100
  tolerations:
    - operator: Exists
  # Same contract as dcgmExporter.staticTargets, for out-of-cluster
  # node-exporters (:9100).
  staticTargets: []   # e.g. [{address: "gpu01.example.internal:9100", node: "gpu01"}]
  # Host directory holding *.prom files written by textfile collectors
  # (e.g. Slurm accounting scripts on a controller node). When set, the
  # DaemonSet mounts it read-only at the same path and enables
  # --collector.textfile.directory. Empty = collector off (default).
  textfileDirectory: ""
  resources:
    requests: {cpu: 50m, memory: 64Mi}

allSmi:
  enabled: false
  image: ghcr.io/inureyes/all-smi:v0.25.0
  port: 9090
  interval: 5
  nodeSelector:
    nvidia.com/gpu.present: "true"
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
  resources:
    requests: {cpu: 100m, memory: 128Mi}

# -- Slurm integration (optional) --
slurm:
  enabled: false
  # prometheus-slurm-exporter on the slurmctld/login node (queue/partition state)
  queueTargets: []        # e.g. ["slurmctld.example.internal:9092"]
  # slurm-job-exporter on compute nodes that are NOT cluster members,
  # running host-side (systemd) and enumerated statically.
  jobTargets: []          # e.g. [{address: "gpu01.example.internal:9798", node: "gpu01"}]
  # In-cluster alternative to jobTargets: run slurm-job-exporter as a
  # DaemonSet on compute nodes that ARE cluster members. Discovered by the
  # algalon-pods kubernetes_sd job (no scrape-config change), node label
  # comes from kubernetes_sd. Requires a host-side nv-hostengine on every
  # selected node — the exporter is a remote DCGM client via hostNetwork
  # (localhost:5555). Enable EITHER this OR jobTargets for a given node
  # set; both at once double-scrapes the same jobs.
  jobExporter:
    enabled: false
    image: ghcr.io/appleparan/slurm-job-exporter:0.4.12
    port: 9798
    dcgmUpdateInterval: 10
    # Per-job GPU attribution runs `nvidia-smi -L` inside each job cgroup,
    # and nvidia-smi is injected by the nvidia container runtime rather than
    # baked into the image. Set this to "nvidia" on clusters where that
    # runtime is gated behind a RuntimeClass; leave empty only when the
    # nvidia runtime is already the node default. Without it the pod still
    # reports cgroup CPU/memory but no slurm_job_*_gpu series (cgroup v2).
    runtimeClassName: ""
    nodeSelector: {}
    tolerations: []
    resources:
      requests: {cpu: 100m, memory: 128Mi}

# -- Host stack --
host:
  enabled: true

victoriametrics:
  image: victoriametrics/victoria-metrics:v1.149.0
  retentionMonths: 3
  storage:
    size: 50Gi
    storageClassName: ""
  resources:
    requests: {cpu: 500m, memory: 1Gi}

vmagent:
  image: victoriametrics/vmagent:v1.149.0
  scrapeInterval: 30s
  resources:
    requests: {cpu: 200m, memory: 256Mi}
  # Site-supplied scrape_configs entries, appended verbatim to the
  # generated prometheus.yml. Must be a YAML list fragment starting at
  # "- job_name: ...". A malformed fragment fails vmagent config load —
  # validation is the site's responsibility.
  #   --set-file 'vmagent.extraScrapeConfigs=path/to/scrape.yaml'
  extraScrapeConfigs: ""

vmalert:
  image: victoriametrics/vmalert:v1.149.0
  evaluationInterval: 30s
  resources:
    requests: {cpu: 100m, memory: 128Mi}
  # Site-supplied rule files, appended to the chart's own rule set.
  # Map of <name> -> full vmalert rule-file content; each entry renders
  # as ConfigMap key extra-<name>.yml so it cannot collide with chart
  # files. Inject at install time, e.g.
  #   --set-file 'vmalert.extraRules.h100-serving=path/to/rules.yaml'
  # Validating injected rules is the site's responsibility.
  extraRules: {}

alertmanager:
  image: prom/alertmanager:v0.33.1
  resources:
    requests: {cpu: 50m, memory: 64Mi}
  slack:
    # Either reference an existing Secret with keys
    # slack_webhook_critical / slack_webhook_warning...
    existingSecret: ""
    # ...or set URLs here and the chart creates the Secret (not recommended
    # for GitOps — values files end up in git).
    criticalUrl: ""
    warningUrl: ""

grafana:
  image: grafana/grafana:13.1.3
  adminUser: admin
  adminPassword: admin
  resources:
    requests: {cpu: 100m, memory: 256Mi}
  # Site-supplied dashboards, same contract as vmalert.extraRules:
  # <name> -> dashboard JSON string, rendered as extra-<name>.json.
  #   --set-file 'grafana.extraDashboards.h100-serving=path/to/dash.json'
  extraDashboards: {}
