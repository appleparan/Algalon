{{- if .Values.nodeExporter.enabled }}
{{/*
Precursor layer: interrupts, runnable procs, vmstat, NFS mountstats
(spec §3). hostNetwork + hostPID so /proc reflects the node, not the
container. --collector.mountstats is REQUIRED — without it the entire
storage-nfs rule group is silently inert.
*/}}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "algalon.fullname" . }}-node-exporter
  labels:
    {{- include "algalon.labels" (dict "ctx" $ "component" "node-exporter") | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "algalon.selectorLabels" (dict "ctx" $ "component" "node-exporter") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "algalon.selectorLabels" (dict "ctx" $ "component" "node-exporter") | nindent 8 }}
        algalon.io/scrape: "true"
        algalon.io/job: node
    spec:
      hostNetwork: true
      hostPID: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- with .Values.nodeExporter.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeExporter.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: node-exporter
          image: {{ .Values.nodeExporter.image }}
          args:
            - --path.procfs=/host/proc
            - --path.sysfs=/host/sys
            - --path.rootfs=/rootfs
            - --collector.mountstats
            # Host Saturation (USE) dashboard inputs; same set and rationale
            # as deploy/compose/worker/docker-compose.yml. Each one missing
            # leaves its panels silently empty:
            #   meminfo_numa   per-NUMA free memory and miss/foreign (off by default)
            #   vmstat.fields  default set plus pgscan*/pgsteal* (page reclaim);
            #                  must keep pgpg - node-precursor alerts read
            #                  node_vmstat_pgpgout
            #   mount-points-exclude  default minus /dev, so /dev/shm is collected
            # pressure, schedstat, softnet and infiniband are on by default.
            - --collector.meminfo_numa
            - '--collector.vmstat.fields=^(oom_kill|pgpg|pswp|pg.*fault|pgscan|pgsteal).*'
            - '--collector.filesystem.mount-points-exclude=^/(proc|run/credentials/.+|sys|var/lib/docker/.+|var/lib/containers/storage/.+)($|/)'
            {{- if .Values.nodeExporter.textfileDirectory }}
            - --collector.textfile.directory={{ .Values.nodeExporter.textfileDirectory }}
            {{- end }}
            - --web.listen-address=:{{ .Values.nodeExporter.port }}
          ports:
            - name: metrics
              containerPort: {{ .Values.nodeExporter.port }}
              hostPort: {{ .Values.nodeExporter.port }}
              protocol: TCP
          volumeMounts:
            - name: proc
              mountPath: /host/proc
              readOnly: true
            - name: sys
              mountPath: /host/sys
              readOnly: true
            - name: rootfs
              mountPath: /rootfs
              readOnly: true
            {{- if .Values.nodeExporter.textfileDirectory }}
            # Mounted at its host path so *.prom files written by host-side
            # collectors are read from the same location the operator knows.
            - name: textfile
              mountPath: {{ .Values.nodeExporter.textfileDirectory }}
              readOnly: true
            {{- end }}
          {{- with .Values.nodeExporter.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: proc
          hostPath:
            path: /proc
        - name: sys
          hostPath:
            path: /sys
        - name: rootfs
          hostPath:
            path: /
        {{- if .Values.nodeExporter.textfileDirectory }}
        - name: textfile
          hostPath:
            path: {{ .Values.nodeExporter.textfileDirectory }}
            # DirectoryOrCreate, not Directory: the collector that writes the
            # *.prom files may be installed after the DaemonSet rolls out.
            type: DirectoryOrCreate
        {{- end }}
{{- end }}
