{{- if .Values.host.enabled }}
{{/*
Kubernetes counterpart of monitoring/scrape/prometheus.yml. Compose enumerates
targets from static files; here a single kubernetes_sd job discovers every
opted-in worker pod and relabelling reconstructs the same label contract:
  job  == dcgm | node | all-smi | slurm-job   (alert rules filter on it)
  node == the node the pod runs on (Alertmanager groups on it)
slurm-job reaches vmagent either way: as discovered pods when
slurm.jobExporter is enabled (compute nodes that ARE cluster members), or
as static_configs from slurm.jobTargets when they are not. Both paths end
up on the same job/node label pair, so nothing downstream distinguishes
them.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "algalon.fullname" . }}-vmagent
  labels:
    {{- include "algalon.labels" (dict "ctx" $ "component" "vmagent") | nindent 4 }}
data:
  prometheus.yml: |
    global:
      scrape_interval: {{ .Values.vmagent.scrapeInterval }}
      scrape_timeout: 10s

    scrape_configs:
      # One discovery job for all exporters; the job label is rewritten per pod
      # so alert rules keep seeing job="dcgm" / job="node" / job="all-smi".
      - job_name: algalon-pods
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          # Opt-in: only pods labelled algalon.io/scrape=true are scraped.
          - source_labels: [__meta_kubernetes_pod_label_algalon_io_scrape]
            action: keep
            regex: "true"
          # Exactly one target per pod: every exporter names its port "metrics".
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            action: keep
            regex: metrics
          # Job-name contract, carried on the pod as algalon.io/job.
          - source_labels: [__meta_kubernetes_pod_label_algalon_io_job]
            target_label: job
          # Every series is attributable to a node.
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node
      {{- if .Values.dcgmExporter.staticTargets }}
      # Out-of-cluster dcgm-exporters (bare-metal GPU nodes that are not
      # cluster members). The job_name doubles as the job label, so rules and
      # dashboards see no difference from the DaemonSet pods; the node label
      # comes from the entry — kubernetes_sd cannot derive it, and it must
      # match the same machine's node/slurm-job entries (join key).
      - job_name: dcgm
        static_configs:
        {{- range .Values.dcgmExporter.staticTargets }}
          - targets: [{{ .address | quote }}]
            labels:
              node: {{ .node | quote }}
        {{- end }}
      {{- end }}
      {{- if .Values.nodeExporter.staticTargets }}
      # Same contract for out-of-cluster node-exporters.
      - job_name: node
        static_configs:
        {{- range .Values.nodeExporter.staticTargets }}
          - targets: [{{ .address | quote }}]
            labels:
              node: {{ .node | quote }}
        {{- end }}
      {{- end }}
      {{- if .Values.slurm.enabled }}
      # Slurm exporters live outside the cluster, so kubernetes_sd cannot see
      # them — they are enumerated statically from values.yaml instead.
      # job slurm     = prometheus-slurm-exporter (one per cluster, :9092)
      # job slurm-job = slurm-job-exporter (one per compute node, :9798)
      # Each slurm-job entry carries the `node` label that joins its per-job
      # series to the dcgm/node series of the same machine.
      - job_name: slurm
        static_configs:
        {{- range .Values.slurm.queueTargets }}
          - targets: [{{ . | quote }}]
        {{- end }}

      - job_name: slurm-job
        static_configs:
        {{- range .Values.slurm.jobTargets }}
          - targets: [{{ .address | quote }}]
            labels:
              node: {{ .node | quote }}
        {{- end }}
      {{- end }}
{{- end }}
