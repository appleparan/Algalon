{{- if .Values.host.enabled }}
{{/*
Alert and recording rules, one ConfigMap key per monitoring/rules/*.yml so
vmalert's --rule=/rules/*.yml glob keeps working unchanged. Contents are
injected verbatim via .Files — the rules embed Go template expressions
({{`{{ $labels.node }}`}}) that belong to vmalert, not to Helm.
Generated by `make helm-sync`; edit monitoring/rules/, never files/.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "algalon.fullname" . }}-rules
  labels:
    {{- include "algalon.labels" (dict "ctx" $ "component" "vmalert") | nindent 4 }}
data:
{{- range $path, $_ := .Files.Glob "files/rules/*.yml" }}
  {{ base $path }}: |-
    {{- $.Files.Get $path | nindent 4 }}
{{- end }}
{{- end }}
