{{- if .Values.host.enabled }}
{{- if not .Values.alertmanager.slack.existingSecret }}
{{/*
Chart-managed Slack webhooks. Only rendered when the operator supplied both
URLs in values; with alertmanager.slack.existingSecret set, the Secret is
theirs and this template stays silent. Neither case fails the render in
algalon.alertmanagerSecretName — see templates/_helpers.tpl.
The keys are consumed as FILES (api_url_file) by the alerting policy, so
their names are a contract with monitoring/alerting/alertmanager.yml.
*/}}
{{- $_ := include "algalon.alertmanagerSecretName" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "algalon.fullname" . }}-alertmanager-slack
  labels:
    {{- include "algalon.labels" (dict "ctx" $ "component" "alertmanager") | nindent 4 }}
type: Opaque
stringData:
  slack_webhook_critical: {{ .Values.alertmanager.slack.criticalUrl | quote }}
  slack_webhook_warning: {{ .Values.alertmanager.slack.warningUrl | quote }}
{{- end }}
{{- end }}
