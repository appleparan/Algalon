{{- if .Values.host.enabled }}
{{/*
Routing policy (spec §5), byte-identical to the file compose bind-mounts.
Injected verbatim via .Files.Get: the policy's title/text fields contain
Alertmanager's own Go templates ({{`{{ .GroupLabels.alertname }}`}}) which
Helm must not evaluate. Generated by `make helm-sync`; edit
monitoring/alerting/alertmanager.yml, never files/.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "algalon.fullname" . }}-alertmanager
  labels:
    {{- include "algalon.labels" (dict "ctx" $ "component" "alertmanager") | nindent 4 }}
data:
  alertmanager.yml: |-
    {{- .Files.Get "files/alerting/alertmanager.yml" | nindent 4 }}
{{- end }}
