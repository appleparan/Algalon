{{- if .Values.host.enabled }}
{{/*
The Algalon dashboards, one ConfigMap key per monitoring/dashboards/*.json, so
the `algalon` file provider sees the same directory layout it does under
compose. ~130KB total, comfortably inside the 1MiB ConfigMap limit; split
this if the set ever grows several times over. Contents are injected
verbatim via .Files — the JSON is the single source of truth and must not
be rewritten here.
Generated by `make helm-sync`; edit monitoring/dashboards/, never files/.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "algalon.fullname" . }}-grafana-dashboards
  labels:
    {{- include "algalon.labels" (dict "ctx" $ "component" "grafana") | nindent 4 }}
data:
{{- range $path, $_ := .Files.Glob "files/dashboards/*.json" }}
  {{ base $path }}: |-
    {{- $.Files.Get $path | nindent 4 }}
{{- end }}
{{- range $name, $content := .Values.grafana.extraDashboards }}
  {{/* Site-supplied dashboards (values), house-style is the site's call. */}}
  extra-{{ $name }}.json: |-
    {{- $content | nindent 4 }}
{{- end }}
{{- end }}
